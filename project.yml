# GroomCard for iPhone. Codemagic turns this file into the Xcode project (with XcodeGen) before building,
# so no Mac is needed. To change the website the app opens, edit AppConfig.swift and WKAppBoundDomains below.
name: GroomCard
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
targets:
  GroomCard:
    type: application
    platform: iOS
    sources:
      - path: GroomCard
        excludes:
          - "PrivacyInfo.xcprivacy"
          - "Info.plist"
      - path: GroomCard/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.groomcard
        PRODUCT_NAME: GroomCard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GroomCard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: GroomCard/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: GroomCard
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UIViewControllerBasedStatusBarAppearance: true
        WKAppBoundDomains:
          - wouldbebn.pythonanywhere.com
    scheme: {}
